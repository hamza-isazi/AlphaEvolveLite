db_uri: sqlite:///alphaevolve.db
debug: true

experiment:
  label: error-correcting-codes-v7
  notes: "Evolve error correcting code algorithms using symbol error simulation."
  save_top_k: 3

llm:
  provider: gemini  # Options: gemini, openai, openrouter, custom
  llm_timeout: 300.0
  models:
    - name: gemini-2.5-flash-lite
      probability: 1.0
      temperature: 0.7

    # - name: gpt-oss:20b
    #   probability: 1.0
    #   temperature: 0.7

    # - name: qwen/qwen3-coder-30b
    #   probability: 1.0
    #   temperature: 0.7

    # - name: gpt-oss:20b
    #   probability: 1.0
    #   temperature: 0.7



    # Qwen3 is one of the best models for code generation and is quite cheap
    # - name: qwen/qwen3-coder
    #   probability: 1.0
    #   temperature: 0.7
  system_prompt: |
    You are solving the following problem:
    Implement error correcting codes for binary data arrays.
    
    Constraints:
    - Do not use Python libraries which have built in error correction code algorithms
    - The code must be in a single file called solution.py.
    - Your solution must implement a class with encode() and decode() methods
    - The decode function must correct errors in the encoded data
    - The encode/decode must be lossless for valid data
    
    Evaluation Details:
    - Your solution will be tested on binary data arrays (250 bits) with random bit flips
    - The evaluation introduces symbol errors (bit flips) in the encoded data
    - Multiple error rates are tested: 0.0001, 0.0005, 0.001, 0.002 (0.01% to 0.2%)
    - Scoring is based on reliable throughput: code rate × success rate across error levels
    - Target frame error rate: ≤0.001 (99.9% success rate)
    
    Technical Requirements:
    - Your solution must implement a class with encode() and decode() methods
    - encode(u: np.ndarray[uint8]) -> np.ndarray[uint8]: converts input bits to coded bits
    - decode(corrupted: np.ndarray[float64]) -> np.ndarray[uint8]: recovers original bits
    - The class must have a 'rate' property (float) representing code rate
    - encode() should return longer array (redundancy), decode() should return original length
    - The class must be instantiable and have a build_code() function that returns an instance
    
    Current Baseline Performance:
    - Simple repetition code: score 0.167 (rate 0.333, handles low error rates)
    - Reed-Solomon code: score 0.8 (rate 0.8, handles higher error rates)
    
    Your goal is to improve upon these baselines by:
    1. Increasing the code rate (more efficient encoding)
    2. Improving error correction capability (handling higher error rates)
    3. Maintaining computational efficiency
    
    IMPORTANT: Focus on the numpy array interface. Do NOT implement string-based encode/decode functions.
    The evaluator calls build_code() to get your class instance, then calls encode() and decode() 
    directly on that instance with numpy arrays.
    
    Example structure:
    ```python
    import numpy as np
    
    class YourCode:
        def __init__(self):
            # Initialize your code parameters
            pass
            
        @property
        def rate(self) -> float:
            return 0.5  # Your code rate
            
        def encode(self, u: np.ndarray) -> np.ndarray:
            # Convert input bits to coded bits
            # Return longer array with redundancy
            pass
            
        def decode(self, corrupted: np.ndarray) -> np.ndarray:
            # Recover original bits from corrupted coded bits
            # Return array of original length
            pass
    
    def build_code():
        return YourCode()
    ```

evolution:
  population_size: 5          # Increased for better exploration
  temperature: 1.0            # Balanced exploration/exploitation
  max_generations: 5         # More generations for meaningful evolution
  inspiration_count: 3        # More inspiration sources
  max_retries: 3              # Retries for failed program generation
  eval_timeout: 300.0         # Timeout for evaluation runs
  enable_feedback: false       # Enable LLM feedback for successful programs
  selection_method: enhanced_inspiration  # Enhanced inspiration selection
  recent_generations: 3       # Consider recent performance
  recent_percentile: 20.0     # Top 20% threshold for recent selection
  tabu_search_probability: 0.3  # 30% chance of fundamentally new approaches

problem:
  entry_script: examples/error_correcting_codes/initial_program.py
  evaluator:    examples/error_correcting_codes/evaluate.py