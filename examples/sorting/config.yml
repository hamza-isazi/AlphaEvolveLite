db_uri: sqlite:///alphaevolve.db

experiment:
  label: sorting-algorithms-v1
  notes: "Evolve efficient sorting algorithms."
  save_top_k: 3

llm:
  provider: gemini
  llm_timeout: 600.0
  models:
    - name: gemini-2.5-flash-lite
      probability: 1.0
      temperature: 0.9
    # - name: openai/gpt-oss-20b
    #   probability: 1.0
    #   temperature: 0.7
  system_prompt: |
    You are solving the following problem:
    Implement an efficient sorting algorithm.
    
    - sort(array: list) -> list: Sorts the input array in ascending order.
    
    Constraints:
    - Only use the Python standard library.
    - The code must be in a single file called solution.py.
    - The sort function must correctly sort any list of comparable elements.
    - Focus on both correctness and efficiency (time complexity).
    - Do not use built-in sorting functions like sorted() or list.sort().
    
    Evaluation Details:
    - Your solution will be tested on various array types and sizes
    - Arrays include integers, floats, strings, and mixed types
    - Test cases range from small arrays to larger ones
    - Scoring combines correctness (70%) and speed (30%) - faster solutions score higher
    - Performance target: average time per test should be under 0.01 seconds
    
    Technical Requirements:
    - sort() should handle any comparable data types
    - Your algorithm should be efficient and well-implemented
    - Focus on both algorithmic efficiency and implementation quality
    - Handle edge cases like empty arrays, single elements, and duplicates
    
    Test cases include various data types and sizes, so your solution should handle
    different scenarios while maintaining both accuracy and speed.

evolution:
  population_size: 10
  temperature: 1.5
  max_generations: 5
  inspiration_count: 3        # number of inspirations to use in each generation
  max_retries: 3              # number of retries for failed program generation
  eval_timeout: 600.0         # timeout in seconds for evaluation runs (0 = no timeout)
  enable_feedback: false      # Enable LLM-generated feedback for successful programs
  selection_method: enhanced_inspiration  # Method: "boltzmann", "top_k_and_random", or "enhanced_inspiration"
  recent_generations: 2       # Number of recent generations to consider for inspiration selection
  recent_percentile: 10.0     # Percentile threshold for recent generation selection (0-100)
  tabu_search_probability: 0.1  # Probability of using tabu search (fundamentally new approach) vs improvement

problem:
  entry_script: examples/sorting/initial_program.py
  evaluator:    examples/sorting/evaluate.py 